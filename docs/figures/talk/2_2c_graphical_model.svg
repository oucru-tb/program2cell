<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="58" font-size="34" font-weight="bold" fill="#2b2d42">PALM as a graphical model</text>
  <text x="40" y="92" font-size="19" fill="#5c6670">Arrows mean "influences". Known inputs are squares; what we estimate are circles; the bulk data are filled</text>

  <!-- ===================== LEFT: plate diagram ===================== -->
  <!-- population-level (outside plates) -->
  <text x="60" y="160" font-size="16" font-weight="bold" fill="#5c6670">shared by all patients</text>

  <circle cx="135" cy="300" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="135" y="309" font-size="28" font-weight="bold" fill="#2563eb" text-anchor="middle">γ</text>
  <text x="135" y="362" font-size="14" fill="#2563eb" text-anchor="middle">treatment shifts</text>
  <text x="135" y="379" font-size="14" fill="#2563eb" text-anchor="middle">the cell mix</text>

  <circle cx="135" cy="490" r="42" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="135" y="499" font-size="28" font-weight="bold" fill="#ea580c" text-anchor="middle">β</text>
  <text x="135" y="552" font-size="14" fill="#ea580c" text-anchor="middle">treatment switches</text>
  <text x="135" y="569" font-size="14" fill="#ea580c" text-anchor="middle">programs per cell type</text>

  <!-- sample plate -->
  <rect x="270" y="130" width="720" height="580" rx="16" fill="none" stroke="#9aa0a6" stroke-width="2.5"/>
  <text x="975" y="158" font-size="18" font-weight="bold" fill="#5c6670" text-anchor="end">each patient i</text>

  <!-- treatment -->
  <rect x="320" y="190" width="90" height="70" rx="8" fill="#ffffff" stroke="#2b2d42" stroke-width="2.5"/>
  <text x="365" y="222" font-size="22" font-weight="bold" fill="#2b2d42" text-anchor="middle">T</text>
  <text x="365" y="246" font-size="13" fill="#5c6670" text-anchor="middle">TB / healthy</text>

  <!-- cell type plate -->
  <rect x="440" y="250" width="410" height="300" rx="14" fill="none" stroke="#c4c8cc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="840" y="275" font-size="16" font-weight="bold" fill="#5c6670" text-anchor="end">each cell type c</text>

  <circle cx="530" cy="400" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="530" y="410" font-size="30" font-weight="bold" fill="#2563eb" text-anchor="middle">π</text>
  <text x="530" y="470" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">fraction</text>
  <text x="530" y="488" font-size="13" fill="#2563eb" text-anchor="middle">how many cells</text>

  <!-- program plate (nested) -->
  <rect x="630" y="300" width="200" height="230" rx="12" fill="none" stroke="#d9dcdf" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="820" y="322" font-size="14" font-weight="bold" fill="#5c6670" text-anchor="end">each program p</text>
  <circle cx="730" cy="410" r="48" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="730" y="420" font-size="30" font-weight="bold" fill="#ea580c" text-anchor="middle">δ</text>
  <text x="730" y="480" font-size="15" font-weight="bold" fill="#ea580c" text-anchor="middle">activity</text>
  <text x="730" y="498" font-size="13" fill="#ea580c" text-anchor="middle">program on in this cell</text>

  <!-- gene plate inside sample -->
  <rect x="520" y="575" width="450" height="120" rx="12" fill="none" stroke="#c4c8cc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="960" y="598" font-size="15" font-weight="bold" fill="#5c6670" text-anchor="end">each gene g</text>
  <circle cx="780" cy="640" r="44" fill="#2b2d42" stroke="#2b2d42" stroke-width="3"/>
  <text x="780" y="650" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Y</text>
  <text x="640" y="635" font-size="16" font-weight="bold" fill="#2b2d42" text-anchor="middle">bulk counts</text>
  <text x="640" y="656" font-size="14" fill="#5c6670" text-anchor="middle">(measured)</text>

  <!-- known inputs below -->
  <rect x="440" y="760" width="170" height="90" rx="10" fill="#f1f3f5" stroke="#6b7280" stroke-width="2.5"/>
  <text x="525" y="798" font-size="24" font-weight="bold" fill="#4b5563" text-anchor="middle">B</text>
  <text x="525" y="824" font-size="14" fill="#4b5563" text-anchor="middle">reference profiles</text>
  <text x="525" y="841" font-size="13" fill="#6b7280" text-anchor="middle">healthy atlas average</text>

  <rect x="660" y="760" width="170" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="745" y="798" font-size="24" font-weight="bold" fill="#16a34a" text-anchor="middle">G</text>
  <text x="745" y="824" font-size="14" fill="#16a34a" text-anchor="middle">program genes</text>
  <text x="745" y="841" font-size="13" fill="#16a34a" text-anchor="middle">PROGENy</text>

  <!-- edges -->
  <g stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M177,300 L478,392"/>
    <path d="M177,490 L680,418"/>
    <path d="M410,236 L488,370"/>
    <path d="M410,226 Q600,200 696,368"/>
    <path d="M565,434 L748,602"/>
    <path d="M778,418 Q835,500 800,598"/>
    <path d="M560,760 L740,676"/>
    <path d="M760,760 L775,686"/>
  </g>

  <!-- ===================== RIGHT: equation + pipeline ===================== -->
  <rect x="1030" y="130" width="530" height="150" rx="14" fill="#f8fafc" stroke="#e1e4e8" stroke-width="2"/>
  <text x="1055" y="165" font-size="18" font-weight="bold" fill="#2b2d42">The arrow into Y, written out</text>
  <text x="1055" y="210" font-size="24" fill="#2b2d42">Y<tspan font-size="15" dy="6">ig</tspan><tspan dy="-6"> ≈ Σ</tspan><tspan font-size="15" dy="6">c</tspan><tspan dy="-6"> </tspan><tspan fill="#2563eb" font-weight="bold">π</tspan><tspan font-size="15" dy="6" fill="#2563eb">ic</tspan><tspan dy="-6"> · </tspan><tspan fill="#4b5563" font-weight="bold">B</tspan><tspan font-size="15" dy="6" fill="#4b5563">cg</tspan><tspan dy="-6"> · exp( </tspan><tspan fill="#ea580c" font-weight="bold">δ</tspan><tspan font-size="15" dy="6" fill="#ea580c">icp</tspan><tspan dy="-6"> × </tspan><tspan fill="#16a34a" font-weight="bold">G</tspan><tspan font-size="15" dy="6" fill="#16a34a">pg</tspan><tspan dy="-6"> )</tspan></text>
  <text x="1055" y="248" font-size="15" fill="#5c6670">counts are noisy (negative binomial); π and δ</text>
  <text x="1055" y="268" font-size="15" fill="#5c6670">get their uncertainty from the fit</text>

  <text x="1030" y="325" font-size="20" font-weight="bold" fill="#2b2d42">From the model to the answers</text>

  <g font-size="16">
    <rect x="1030" y="340" width="530" height="66" rx="10" fill="#dbeafe"/>
    <text x="1050" y="368" font-weight="bold" fill="#2563eb">1  Fit the model</text>
    <text x="1050" y="392" fill="#333">cell fractions π for every patient, with uncertainty</text>

    <rect x="1030" y="416" width="530" height="66" rx="10" fill="#f1f3f5"/>
    <text x="1050" y="444" font-weight="bold" fill="#2b2d42">2  Split each sample's reads between cell types</text>
    <text x="1050" y="468" fill="#333">→ program activity δ for each cell type</text>

    <rect x="1030" y="492" width="530" height="66" rx="10" fill="#f1f3f5"/>
    <text x="1050" y="520" font-weight="bold" fill="#2b2d42">3  Calibrate on atlas donors with a known answer</text>
    <text x="1050" y="544" fill="#333">corrects spillover between cell types; gives 90% ranges</text>

    <rect x="1030" y="568" width="530" height="66" rx="10" fill="#ffedd5"/>
    <text x="1050" y="596" font-weight="bold" fill="#ea580c">4  Treatment effect β per cell type</text>
    <text x="1050" y="620" fill="#333">two estimators, checked by simulating this study; keep the sharper</text>

    <rect x="1030" y="644" width="530" height="66" rx="10" fill="#eaf7ee" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1050" y="672" font-weight="bold" fill="#166534">Answers</text>
    <text x="1050" y="696" fill="#333">per-cell change ± 90% range; contributions (more cells / cells changed)</text>
  </g>

  <g stroke="#9aa0a6" stroke-width="2" marker-end="url(#arr)">
    <line x1="1295" y1="406" x2="1295" y2="414"/>
    <line x1="1295" y1="482" x2="1295" y2="490"/>
    <line x1="1295" y1="558" x2="1295" y2="566"/>
    <line x1="1295" y1="634" x2="1295" y2="642"/>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#333">
    <circle cx="1048" cy="760" r="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1068" y="765">estimated</text>
    <rect x="1170" y="748" width="24" height="24" rx="4" fill="#f1f3f5" stroke="#6b7280" stroke-width="2"/>
    <text x="1204" y="765">known input</text>
    <circle cx="1338" cy="760" r="12" fill="#2b2d42"/>
    <text x="1358" y="765">measured</text>
    <rect x="1030" y="790" width="40" height="26" rx="6" fill="none" stroke="#9aa0a6" stroke-width="2"/>
    <text x="1080" y="808">box = repeated for each patient / cell type / program / gene</text>
  </g>
</svg>
