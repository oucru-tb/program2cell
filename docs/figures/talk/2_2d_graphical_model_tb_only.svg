<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="58" font-size="34" font-weight="bold" fill="#2b2d42">PALM with TB patients only (no comparison group)</text>
  <text x="40" y="92" font-size="19" fill="#5c6670">No treatment node: each patient's mix and program activity are estimated, then compared between patients</text>

  <!-- ===================== LEFT: plate diagram ===================== -->
  <text x="60" y="160" font-size="16" font-weight="bold" fill="#5c6670">shared by all patients</text>

  <circle cx="135" cy="300" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="135" y="309" font-size="28" font-weight="bold" fill="#2563eb" text-anchor="middle">a</text>
  <text x="135" y="362" font-size="14" fill="#2563eb" text-anchor="middle">average cell mix</text>
  <text x="135" y="379" font-size="14" fill="#2563eb" text-anchor="middle">in this cohort</text>

  <circle cx="135" cy="490" r="42" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="135" y="499" font-size="28" font-weight="bold" fill="#ea580c" text-anchor="middle">κ</text>
  <text x="135" y="552" font-size="14" fill="#ea580c" text-anchor="middle">average program</text>
  <text x="135" y="569" font-size="14" fill="#ea580c" text-anchor="middle">activity per cell type</text>

  <!-- patient plate -->
  <rect x="270" y="130" width="720" height="580" rx="16" fill="none" stroke="#9aa0a6" stroke-width="2.5"/>
  <text x="975" y="158" font-size="18" font-weight="bold" fill="#5c6670" text-anchor="end">each TB patient i</text>

  <!-- clinical measure, used after the fit -->
  <rect x="300" y="180" width="140" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="370" y="210" font-size="20" font-weight="bold" fill="#7c3aed" text-anchor="middle">Z</text>
  <text x="370" y="232" font-size="12.5" fill="#7c3aed" text-anchor="middle">clinical measure</text>
  <text x="370" y="247" font-size="12" fill="#7c3aed" text-anchor="middle">(load, cavity, time)</text>

  <!-- cell type plate -->
  <rect x="440" y="250" width="410" height="300" rx="14" fill="none" stroke="#c4c8cc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="840" y="275" font-size="16" font-weight="bold" fill="#5c6670" text-anchor="end">each cell type c</text>

  <circle cx="530" cy="400" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="530" y="410" font-size="30" font-weight="bold" fill="#2563eb" text-anchor="middle">π</text>
  <text x="530" y="470" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">fraction</text>
  <text x="530" y="488" font-size="13" fill="#2563eb" text-anchor="middle">this patient's mix</text>

  <rect x="630" y="300" width="200" height="230" rx="12" fill="none" stroke="#d9dcdf" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="820" y="322" font-size="14" font-weight="bold" fill="#5c6670" text-anchor="end">each program p</text>
  <circle cx="730" cy="410" r="48" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="730" y="420" font-size="30" font-weight="bold" fill="#ea580c" text-anchor="middle">δ</text>
  <text x="730" y="480" font-size="15" font-weight="bold" fill="#ea580c" text-anchor="middle">activity</text>
  <text x="730" y="498" font-size="13" fill="#ea580c" text-anchor="middle">vs healthy atlas average</text>

  <!-- gene plate -->
  <rect x="520" y="575" width="450" height="120" rx="12" fill="none" stroke="#c4c8cc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="960" y="598" font-size="15" font-weight="bold" fill="#5c6670" text-anchor="end">each gene g</text>
  <circle cx="780" cy="640" r="44" fill="#2b2d42" stroke="#2b2d42" stroke-width="3"/>
  <text x="780" y="650" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Y</text>
  <text x="640" y="635" font-size="16" font-weight="bold" fill="#2b2d42" text-anchor="middle">bulk counts</text>
  <text x="640" y="656" font-size="14" fill="#5c6670" text-anchor="middle">(measured)</text>

  <!-- known inputs -->
  <rect x="440" y="760" width="170" height="90" rx="10" fill="#f1f3f5" stroke="#6b7280" stroke-width="2.5"/>
  <text x="525" y="798" font-size="24" font-weight="bold" fill="#4b5563" text-anchor="middle">B</text>
  <text x="525" y="824" font-size="14" fill="#4b5563" text-anchor="middle">reference profiles</text>
  <text x="525" y="841" font-size="13" fill="#6b7280" text-anchor="middle">healthy atlas average</text>

  <rect x="660" y="760" width="170" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="745" y="798" font-size="24" font-weight="bold" fill="#16a34a" text-anchor="middle">G</text>
  <text x="745" y="824" font-size="14" fill="#16a34a" text-anchor="middle">program genes</text>
  <text x="745" y="841" font-size="13" fill="#16a34a" text-anchor="middle">PROGENy</text>

  <!-- model edges -->
  <g stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M177,300 L478,392"/>
    <path d="M177,490 L680,418"/>
    <path d="M565,434 L748,602"/>
    <path d="M778,418 Q835,500 800,598"/>
    <path d="M560,760 L740,676"/>
    <path d="M760,760 L775,686"/>
  </g>
  <!-- after-the-fit comparison (dashed, purple) -->
  <g stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-start="url(#arrD)" marker-end="url(#arrD)">
    <path d="M446,222 Q620,190 700,366"/>
    <path d="M396,262 L490,360"/>
  </g>
  <text x="560" y="182" font-size="14" font-weight="bold" fill="#7c3aed">compared after the fit</text>

  <!-- ===================== RIGHT: what you can claim ===================== -->
  <rect x="1030" y="130" width="530" height="190" rx="14" fill="#eaf7ee" stroke="#16a34a" stroke-width="2"/>
  <text x="1055" y="165" font-size="20" font-weight="bold" fill="#166534">What you get</text>
  <g font-size="16" fill="#333">
    <text x="1055" y="196">• each patient's cell mix π, with a range</text>
    <text x="1055" y="222">• each patient's program activity δ per cell type,</text>
    <text x="1070" y="244">with a 90% range</text>
    <text x="1055" y="270">• which cell types carry each program, per patient</text>
    <text x="1055" y="296">• patient vs patient: does δ follow Z?</text>
  </g>

  <rect x="1030" y="336" width="530" height="128" rx="14" fill="#f1f3f5"/>
  <text x="1055" y="371" font-size="20" font-weight="bold" fill="#2b2d42">What you can't get</text>
  <g font-size="16" fill="#333">
    <text x="1055" y="402">• a TB-vs-healthy effect β: no one to compare with</text>
    <text x="1055" y="428">• "more cells or cells switched on" for a change</text>
    <text x="1070" y="450" fill="#5c6670">(except between TB subgroups or timepoints)</text>
  </g>

  <rect x="1030" y="480" width="530" height="210" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1055" y="515" font-size="20" font-weight="bold" fill="#c2410c">Caution</text>
  <g font-size="16" fill="#333">
    <text x="1055" y="546">• δ is relative to the healthy atlas, not to</text>
    <text x="1070" y="568">healthy blood measured on your platform</text>
    <text x="1055" y="598">• the platform correction learned from TB-only</text>
    <text x="1070" y="620">bulk would remove a signal shared by all patients:</text>
    <text x="1070" y="642">use offsets from paired samples or another cohort</text>
    <text x="1055" y="672" font-weight="bold" fill="#c2410c">Safe: compare patients or timepoints within TB</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#333">
    <circle cx="1048" cy="740" r="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1068" y="745">estimated</text>
    <rect x="1170" y="728" width="24" height="24" rx="4" fill="#f1f3f5" stroke="#6b7280" stroke-width="2"/>
    <text x="1204" y="745">known input</text>
    <circle cx="1338" cy="740" r="12" fill="#2b2d42"/>
    <text x="1358" y="745">measured</text>
    <line x1="1032" y1="782" x2="1072" y2="782" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="1082" y="787">used after the fit, not part of the model</text>
    <rect x="1030" y="806" width="40" height="26" rx="6" fill="none" stroke="#9aa0a6" stroke-width="2"/>
    <text x="1080" y="824">box = repeated for each patient / cell type / program / gene</text>
  </g>
</svg>
