<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="40" y="56" font-size="32" fill="#2b2d42" font-weight="bold" text-anchor="start">PALM with TB patients only (no comparison group)</text>
<text x="40" y="88" font-size="18" fill="#5c6670" font-weight="normal" text-anchor="start">Same model of the mix; the change is estimated along a clinical measure z instead of TB vs healthy</text>
<text x="40" y="140" font-size="20" fill="#2b2d42" font-weight="bold" text-anchor="start">1  The model PALM fits</text>
<text x="40" y="162" font-size="14.5" fill="#5c6670" font-weight="normal" text-anchor="start">gives each patient's cell mix π, with uncertainty</text>
<text x="48" y="222" font-size="13.5" fill="#5c6670" font-weight="bold" text-anchor="start">shared by</text>
<text x="48" y="239" font-size="13.5" fill="#5c6670" font-weight="bold" text-anchor="start">all patients</text>
<circle cx="115" cy="320" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="115" y="329.24" font-size="28" fill="#2563eb" font-weight="bold" text-anchor="middle">a</text>
<text x="115" y="382" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">average</text>
<text x="115" y="400" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">cell mix</text>
<circle cx="115" cy="500" r="40" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="115" y="509.24" font-size="28" fill="#ea580c" font-weight="bold" text-anchor="middle">κ</text>
<text x="115" y="562" font-size="15" fill="#ea580c" font-weight="bold" text-anchor="middle">average program</text>
<text x="115" y="580" font-size="13" fill="#ea580c" font-weight="normal" text-anchor="middle">activity</text>
<rect x="220" y="190" width="670" height="520" rx="14" fill="none" stroke="#9aa0a6" stroke-width="2.5" stroke-dasharray="0"/><text x="878" y="214" font-size="15" fill="#5c6670" font-weight="bold" text-anchor="end">each patient i</text>
<rect x="370" y="255" width="410" height="445" rx="14" fill="none" stroke="#c4c8cc" stroke-width="2" stroke-dasharray="6 4"/><text x="768" y="279" font-size="15" fill="#5c6670" font-weight="bold" text-anchor="end">each cell type c</text>
<rect x="565" y="290" width="205" height="175" rx="14" fill="none" stroke="#d9dcdf" stroke-width="2" stroke-dasharray="3 4"/><text x="758" y="311" font-size="15" fill="#5c6670" font-weight="bold" text-anchor="end">each program p</text>
<rect x="395" y="520" width="485" height="350" rx="14" fill="none" stroke="#c4c8cc" stroke-width="2" stroke-dasharray="6 4"/><text x="868" y="860" font-size="15" fill="#5c6670" font-weight="bold" text-anchor="end">each gene g</text>
<rect x="240" y="215" width="125" height="66" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="302.5" y="240" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">z</text>
<text x="302.5" y="264" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">clinical measure</text>
<circle cx="460" cy="375" r="46" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="460" y="384.9" font-size="30" fill="#2563eb" font-weight="bold" text-anchor="middle">π</text>
<text x="460" y="443" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">fraction</text>
<text x="460" y="461" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">how many cells</text>
<circle cx="640" cy="375" r="42" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="640" y="384.9" font-size="30" fill="#ea580c" font-weight="bold" text-anchor="middle">δ</text>
<text x="690" y="372" font-size="15" fill="#ea580c" font-weight="bold" text-anchor="start">activity</text>
<text x="690" y="390" font-size="13" fill="#ea580c" font-weight="normal" text-anchor="start">helps the fit</text>
<polygon points="600,600 580,634.64 540,634.64 520,600 540,565.36 580,565.36" fill="#fff7e0" stroke="#b07d00" stroke-width="2.5"/>
<text x="560" y="609" font-size="26" fill="#8a6100" font-weight="bold" text-anchor="middle">E</text>
<text x="510" y="606" font-size="14" fill="#8a6100" font-weight="bold" text-anchor="end">cell profile</text>
<circle cx="820" cy="600" r="42" fill="#2b2d42" stroke="#2b2d42" stroke-width="3"/>
<text x="820" y="609.9" font-size="30" fill="#ffffff" font-weight="bold" text-anchor="middle">Y</text>
<text x="820" y="668" font-size="15" fill="#2b2d42" font-weight="bold" text-anchor="middle">bulk counts</text>
<text x="820" y="686" font-size="13" fill="#5c6670" font-weight="normal" text-anchor="middle">(measured)</text>
<rect x="420" y="765" width="160" height="80" rx="10" fill="#f1f3f5" stroke="#6b7280" stroke-width="2.5"/>
<text x="500" y="797" font-size="24" fill="#4b5563" font-weight="bold" text-anchor="middle">B<tspan font-size="14" dy="5">cg</tspan></text>
<text x="500" y="821" font-size="13.5" fill="#4b5563" font-weight="normal" text-anchor="middle">reference profile</text>
<text x="500" y="838" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">atlas average</text>
<rect x="615" y="765" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="695" y="797" font-size="24" fill="#16a34a" font-weight="bold" text-anchor="middle">G<tspan font-size="14" dy="5">pg</tspan></text>
<text x="695" y="821" font-size="13.5" fill="#16a34a" font-weight="normal" text-anchor="middle">program genes</text>
<text x="695" y="838" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">PROGENy</text>
<path d="M155,325 L412,368" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M155,500 L596,386" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M628,416 L582,564" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M500,780 L540,640" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M680,765 L585,640" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M600,600 L776,600" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M488,412 Q640,530 778,588" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="40" y="620" font-size="17" fill="#2b2d42" font-weight="normal" text-anchor="start">Y ≈ Σ<tspan font-size="12" dy="4">c</tspan><tspan dy="-4"> π · E</tspan></text>
<text x="40" y="643" font-size="17" fill="#2b2d42" font-weight="normal" text-anchor="start">E = B · exp(δ × G)</text>
<text x="40" y="668" font-size="13" fill="#5c6670" font-weight="normal" text-anchor="start">noisy counts (neg. binomial)</text>
<text x="935" y="140" font-size="20" fill="#2b2d42" font-weight="bold" text-anchor="start">2  Estimating each cell type's change</text>
<text x="935" y="162" font-size="14.5" fill="#5c6670" font-weight="normal" text-anchor="start">the reported answer comes from here, not from δ in the model</text>
<rect x="935" y="185" width="625" height="70" rx="10" fill="#f1f3f5"/>
<text x="953" y="214" font-size="17" fill="#2b2d42" font-weight="bold" text-anchor="start">1  Split each patient's reads by π</text>
<text x="953" y="239" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">→ program activity per cell type (still has spillover)</text>
<path d="M1247.5,255 L1247.5,273" fill="none" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrG)"/>
<rect x="935" y="275" width="625" height="70" rx="10" fill="#f1f3f5"/>
<text x="953" y="304" font-size="17" fill="#2b2d42" font-weight="bold" text-anchor="start">2  Calibrate on atlas donors with a known answer</text>
<text x="953" y="329" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">corrects the bias, sets honest 90% ranges</text>
<path d="M1247.5,345 L1247.5,363" fill="none" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrG)"/>
<rect x="935" y="365" width="625" height="70" rx="10" fill="#ffedd5"/>
<text x="953" y="394" font-size="17" fill="#ea580c" font-weight="bold" text-anchor="start">3  Unmix across patients along z</text>
<text x="953" y="419" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">spillover map from π and B; z = clinical measure as a continuous contrast</text>
<path d="M478,330 C520,120 860,110 930,205" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="700" y="128" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">π (posterior draws)</text>
<path d="M858,585 C895,520 892,300 930,236" fill="none" stroke="#4b5563" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<path d="M365,250 H 905 Q 918,250 918,280 V 388 Q 918,400 930,400" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrP)"/>
<path d="M1105,435 L1105,470" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrO)"/>
<circle cx="1105" cy="522" r="48" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="1105" y="531.9" font-size="30" fill="#ea580c" font-weight="bold" text-anchor="middle">Δ</text>
<text x="1170" y="510" font-size="17" fill="#ea580c" font-weight="bold" text-anchor="start">change over the z range</text>
<text x="1170" y="533" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">per cell type and program, ± 90% range</text>
<rect x="1265" y="610" width="270" height="62" rx="10" fill="#f1f3f5" stroke="#6b7280" stroke-width="2.5"/>
<text x="1400" y="636" font-size="16" fill="#4b5563" font-weight="bold" text-anchor="middle">single-cell atlas</text>
<text x="1400" y="657" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">healthy donors, known answer</text>
<path d="M1525,610 C1595,460 1595,320 1558,347" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
<text x="1275" y="598" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">→ B, and → calibration (step 2)</text>
<rect x="995" y="700" width="565" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1013" y="730" font-size="17" fill="#c2410c" font-weight="bold" text-anchor="start">Not yet validated (benchmarking.md 0.8)</text>
<text x="1013" y="757" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">• correlating each patient's activity with z: spillover gives false</text>
<text x="1027" y="777" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">associations in non-responding cell types (62-73%, McFarland, 10 splits)</text>
<text x="1013" y="803" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">• unmixing along z: 16-17% McFarland, 12-24% COMBAT (target ≤ 10%)</text>
<text x="1013" y="829" font-size="14.5" fill="#333" font-weight="normal" text-anchor="start">• z is not part of the model: it enters only in step 3</text>
<text x="40" y="728" font-size="15" fill="#2b2d42" font-weight="bold" text-anchor="start">Legend</text>
<circle cx="50" cy="750" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="74" cy="750" r="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="92" y="755" font-size="13.5" fill="#333" font-weight="normal" text-anchor="start">estimated: cell mix / program activity</text>
<rect x="40" y="767" width="20" height="20" rx="4" fill="#f1f3f5" stroke="#6b7280" stroke-width="2"/>
<text x="68" y="782" font-size="13.5" fill="#333" font-weight="normal" text-anchor="start">known input</text>
<circle cx="50" cy="804" r="10" fill="#2b2d42"/>
<text x="68" y="809" font-size="13.5" fill="#333" font-weight="normal" text-anchor="start">measured</text>
<polygon points="60,831 55,839.66 45,839.66 40,831 45,822.34 55,822.34" fill="#fff7e0" stroke="#b07d00" stroke-width="2"/>
<text x="68" y="836" font-size="13.5" fill="#333" font-weight="normal" text-anchor="start">computed</text>
<text x="40" y="862" font-size="12.5" fill="#5c6670" font-weight="normal" text-anchor="start">box = repeated for each</text>
<text x="40" y="878" font-size="12.5" fill="#5c6670" font-weight="normal" text-anchor="start">patient / cell type / program / gene</text>
</svg>