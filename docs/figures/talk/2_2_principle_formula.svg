<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/>
    </marker>
    <radialGradient id="glowHi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <radialGradient id="glowLo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="58" font-size="34" font-weight="bold" fill="#2b2d42">One bulk sample = many cell types, each with programs switched on or off</text>
  <text x="40" y="92" font-size="19" fill="#5c6670">PALM's whole idea in one line: for each gene, what we measure in blood is a sum over cell types</text>

  <!-- ================= Formula ================= -->
  <!-- Bulk -->
  <rect x="40" y="185" width="230" height="90" rx="12" fill="#2b2d42"/>
  <text x="155" y="224" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Bulk signal</text>
  <text x="155" y="254" font-size="17" fill="#d6d9de" text-anchor="middle">of a gene, one patient</text>

  <text x="300" y="248" font-size="52" fill="#2b2d42" text-anchor="middle">=</text>

  <!-- Sum -->
  <text x="370" y="262" font-size="84" fill="#2b2d42" text-anchor="middle">Σ</text>
  <text x="370" y="300" font-size="16" fill="#5c6670" text-anchor="middle">cell types</text>

  <!-- Blue: fraction -->
  <rect x="425" y="190" width="200" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="525" y="242" font-size="30" font-weight="bold" fill="#2563eb" text-anchor="middle">fraction</text>

  <text x="652" y="248" font-size="44" fill="#2b2d42" text-anchor="middle">×</text>

  <!-- Grey: resting profile -->
  <rect x="680" y="190" width="270" height="80" rx="12" fill="#f1f3f5" stroke="#6b7280" stroke-width="3"/>
  <text x="815" y="242" font-size="30" font-weight="bold" fill="#4b5563" text-anchor="middle">resting profile</text>

  <text x="977" y="248" font-size="44" fill="#2b2d42" text-anchor="middle">×</text>

  <!-- e^( orange x green ) -->
  <text x="1022" y="262" font-size="72" font-style="italic" fill="#2b2d42" text-anchor="middle">e</text>
  <rect x="1050" y="128" width="190" height="64" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="1145" y="170" font-size="27" font-weight="bold" fill="#ea580c" text-anchor="middle">activity</text>
  <text x="1263" y="172" font-size="34" fill="#2b2d42" text-anchor="middle">×</text>
  <rect x="1287" y="128" width="270" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1422" y="170" font-size="27" font-weight="bold" fill="#16a34a" text-anchor="middle">program genes</text>

  <!-- Labels under the formula -->
  <g font-size="17" text-anchor="middle">
    <text x="525" y="300" font-weight="bold" fill="#2563eb">How many cells?</text>
    <text x="525" y="322" fill="#333">estimated</text>

    <text x="815" y="300" font-weight="bold" fill="#4b5563">What the cell normally looks like</text>
    <text x="815" y="322" fill="#333">single-cell atlas (known)</text>

    <text x="1145" y="225" font-weight="bold" fill="#ea580c">How strongly this cell</text>
    <text x="1145" y="246" font-weight="bold" fill="#ea580c">type switched it on</text>
    <text x="1145" y="268" fill="#333">what we want to know</text>

    <text x="1422" y="225" font-weight="bold" fill="#16a34a">Which genes form the program</text>
    <text x="1422" y="246" fill="#333">e.g. interferon response</text>
    <text x="1422" y="268" fill="#333">PROGENy / Hallmark (known)</text>
  </g>

  <!-- Brackets: two questions -->
  <path d="M430,338 L430,350 L620,350 L620,338" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="525" y="378" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">→ MORE CELLS?</text>
  <path d="M1052,292 L1052,350 L1555,350 L1555,292" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="1303" y="378" font-size="20" font-weight="bold" fill="#ea580c" text-anchor="middle">→ CELLS SWITCHED ON?</text>

  <line x1="40" y1="408" x2="1560" y2="408" stroke="#e1e4e8" stroke-width="2"/>

  <!-- ================= Lower left: the mixture picture ================= -->
  <text x="40" y="448" font-size="22" font-weight="bold" fill="#2b2d42">Think of a smoothie</text>
  <text x="40" y="474" font-size="16" fill="#5c6670">Each fruit has a size (blue) and a ripeness (orange); the glass only tells you the total taste</text>

  <!-- glass -->
  <path d="M70,505 L230,505 L212,800 L88,800 Z" fill="#f8fafc" stroke="#6b7280" stroke-width="3"/>
  <path d="M77,560 L223,560 L212,800 L88,800 Z" fill="#fde7d4" opacity="0.8"/>
  <g>
    <circle cx="115" cy="610" r="13" fill="#e9a23b"/><circle cx="160" cy="640" r="13" fill="#e9a23b"/>
    <circle cx="190" cy="600" r="13" fill="#e9a23b"/><circle cx="130" cy="700" r="13" fill="#e9a23b"/>
    <circle cx="175" cy="730" r="10" fill="#6c5b9e"/><circle cx="110" cy="760" r="10" fill="#6c5b9e"/>
    <circle cx="150" cy="680" r="8" fill="#4c9f70"/><circle cx="185" cy="770" r="8" fill="#4c9f70"/>
    <circle cx="125" cy="650" r="8" fill="#4c9f70"/>
  </g>
  <text x="150" y="835" font-size="18" font-weight="bold" fill="#2b2d42" text-anchor="middle">Bulk blood sample</text>

  <!-- arrows to cell types -->
  <g stroke="#5c6670" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="240" y1="600" x2="300" y2="560"/>
    <line x1="240" y1="655" x2="300" y2="660"/>
    <line x1="240" y1="710" x2="300" y2="760"/>
  </g>

  <!-- column heads -->
  <text x="535" y="520" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">how many</text>
  <text x="680" y="520" font-size="16" font-weight="bold" fill="#ea580c" text-anchor="middle">program on?</text>

  <!-- Monocyte -->
  <circle cx="325" cy="560" r="18" fill="#e9a23b"/>
  <text x="352" y="566" font-size="18" fill="#2b2d42">Monocyte</text>
  <rect x="465" y="548" width="140" height="24" rx="5" fill="#2563eb"/>
  <circle cx="680" cy="560" r="22" fill="url(#glowHi)" stroke="#ea580c" stroke-width="2"/>
  <text x="712" y="566" font-size="15" fill="#ea580c">on</text>

  <!-- Neutrophil -->
  <circle cx="325" cy="660" r="16" fill="#6c5b9e"/>
  <text x="352" y="666" font-size="18" fill="#2b2d42">Neutrophil</text>
  <rect x="465" y="648" width="90" height="24" rx="5" fill="#2563eb"/>
  <circle cx="680" cy="660" r="22" fill="url(#glowLo)" stroke="#fdba74" stroke-width="2"/>
  <text x="712" y="666" font-size="15" fill="#9a6b45">off</text>

  <!-- T cell -->
  <circle cx="325" cy="760" r="14" fill="#4c9f70"/>
  <text x="352" y="766" font-size="18" fill="#2b2d42">T cell</text>
  <rect x="465" y="748" width="60" height="24" rx="5" fill="#2563eb"/>
  <circle cx="680" cy="760" r="22" fill="url(#glowLo)" stroke="#fdba74" stroke-width="2"/>
  <text x="712" y="766" font-size="15" fill="#9a6b45">off</text>

  <!-- ================= Lower right: what it answers ================= -->
  <text x="800" y="448" font-size="22" font-weight="bold" fill="#2b2d42">What the equation lets us answer</text>

  <rect x="800" y="470" width="760" height="105" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="825" y="508" font-size="22" font-weight="bold" fill="#2563eb">Blue changed  →  more cells</text>
  <text x="825" y="540" font-size="17" fill="#333">e.g. TB: more monocytes in the blood, each one behaving as usual</text>
  <text x="825" y="563" font-size="15" fill="#5c6670">the bulk interferon signal rises only because there are more monocytes</text>

  <rect x="800" y="590" width="760" height="105" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="825" y="628" font-size="22" font-weight="bold" fill="#ea580c">Orange changed  →  cells switched on</text>
  <text x="825" y="660" font-size="17" fill="#333">e.g. TB: monocytes switch on the interferon-γ program, neutrophils do not</text>
  <text x="825" y="683" font-size="15" fill="#5c6670">tells us which cell type carries the change</text>

  <rect x="800" y="710" width="760" height="125" rx="12" fill="#f1f3f5"/>
  <text x="825" y="745" font-size="18" fill="#2b2d42"><tspan font-weight="bold" fill="#6b7280">Grey</tspan> and <tspan font-weight="bold" fill="#16a34a">green</tspan> are known. PALM estimates <tspan font-weight="bold" fill="#2563eb">blue</tspan> and <tspan font-weight="bold" fill="#ea580c">orange</tspan></text>
  <text x="825" y="770" font-size="18" fill="#2b2d42">together, per patient and per cell type, each with a 90% range.</text>
  <text x="825" y="805" font-size="17" fill="#5c6670">If two cell types look too alike for the data to separate them,</text>
  <text x="825" y="827" font-size="17" fill="#5c6670">the range widens: PALM says "can't tell" instead of guessing.</text>
</svg>
