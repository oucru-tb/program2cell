<rect x="1205" y="110" width="360" height="430" rx="12" fill="#f8fafc" stroke="#e1e4e8" stroke-width="2"/>
<text x="1220" y="140" font-size="18" fill="#2b2d42" font-weight="bold" text-anchor="start">Generative model</text>
<text x="1220" y="180" font-size="14" font-weight="bold" fill="#2563eb">Composition</text>
<text x="1227" y="206" font-size="16.5" fill="#2b2d42">η<tspan font-size='11' dy='4'>ic</tspan><tspan dy='-4'> ~ N(a</tspan><tspan font-size='11' dy='4'>c</tspan><tspan dy='-4'> + γ</tspan><tspan font-size='11' dy='4'>c</tspan><tspan dy='-4'> D</tspan><tspan font-size='11' dy='4'>i</tspan><tspan dy='-4'>, s</tspan><tspan font-size='11' dy='4'>η</tspan><tspan dy='-4'>²)</tspan></text>
<text x="1227" y="236" font-size="16.5" fill="#2b2d42">π<tspan font-size='11' dy='4'>i</tspan><tspan dy='-4'> = softmax(η</tspan><tspan font-size='11' dy='4'>i</tspan><tspan dy='-4'>)</tspan></text>
<text x="1220" y="274" font-size="14" font-weight="bold" fill="#ea580c">Program activity</text>
<text x="1227" y="300" font-size="16.5" fill="#2b2d42">δ<tspan font-size='11' dy='4'>icp</tspan><tspan dy='-4'> ~ N(κ</tspan><tspan font-size='11' dy='4'>cp</tspan><tspan dy='-4'> + β</tspan><tspan font-size='11' dy='4'>cp</tspan><tspan dy='-4'> D</tspan><tspan font-size='11' dy='4'>i</tspan><tspan dy='-4'> + λ</tspan><tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'> u</tspan><tspan font-size='11' dy='4'>ip</tspan><tspan dy='-4'>, σ</tspan><tspan font-size='11' dy='4'>c</tspan><tspan dy='-4'>²)</tspan></text>
<text x="1227" y="330" font-size="16.5" fill="#2b2d42">κ ~ HS(τ<tspan font-size='11' dy='4'>κ</tspan><tspan dy='-4'>), β ~ HS(τ</tspan><tspan font-size='11' dy='4'>β</tspan><tspan dy='-4'>);  u</tspan><tspan font-size='11' dy='4'>ip</tspan><tspan dy='-4'> ~ N(0, 1)</tspan></text>
<text x="1220" y="368" font-size="14" font-weight="bold" fill="#2b2d42">Counts</text>
<text x="1227" y="394" font-size="16.5" fill="#2b2d42">μ<tspan font-size='11' dy='4'>ig</tspan><tspan dy='-4'> = L</tspan><tspan font-size='11' dy='4'>i</tspan><tspan dy='-4'> Σ</tspan><tspan font-size='11' dy='4'>c</tspan><tspan dy='-4'> π</tspan><tspan font-size='11' dy='4'>ic</tspan><tspan dy='-4'> E</tspan><tspan font-size='11' dy='4'>icg</tspan></text>
<text x="1227" y="424" font-size="16.5" fill="#2b2d42">E<tspan font-size='11' dy='4'>icg</tspan><tspan dy='-4'> = softmax</tspan><tspan font-size='11' dy='4'>g</tspan><tspan dy='-4'>(log B</tspan><tspan font-size='11' dy='4'>cg</tspan><tspan dy='-4'> + Σ</tspan><tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'> δ</tspan><tspan font-size='11' dy='4'>icp</tspan><tspan dy='-4'> G</tspan><tspan font-size='11' dy='4'>pg</tspan><tspan dy='-4'>)</tspan></text>
<text x="1227" y="454" font-size="16.5" fill="#2b2d42">L<tspan font-size='11' dy='4'>i</tspan><tspan dy='-4'> library size, θ</tspan><tspan font-size='11' dy='4'>g</tspan><tspan dy='-4'> dispersion: plugged in</tspan></text>
<text x="1227" y="484" font-size="16.5" fill="#2b2d42">Y<tspan font-size='11' dy='4'>ig</tspan><tspan dy='-4'> ~ NegBin(μ</tspan><tspan font-size='11' dy='4'>ig</tspan><tspan dy='-4'>, θ</tspan><tspan font-size='11' dy='4'>g</tspan><tspan dy='-4'>)</tspan></text>
<text x="1220" y="512" font-size="12.5" fill="#5c6670" font-weight="normal" text-anchor="start">Fit: each patient summarised at its mode (Laplace),</text>
<text x="1220" y="529" font-size="12.5" fill="#5c6670" font-weight="normal" text-anchor="start">then NUTS on the shared parameters (two-stage).</text>
<text x="1220" y="575" font-size="16" fill="#2b2d42" font-weight="bold" text-anchor="start">Notation</text>
<circle cx="1233" cy="598" r="10" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="1255" y="603" font-size="14" fill="#333" font-weight="normal" text-anchor="start">latent (estimated)</text>
<circle cx="1233" cy="628" r="10" fill="#cfd4da" stroke="#2b2d42" stroke-width="2"/>
<text x="1255" y="633" font-size="14" fill="#333" font-weight="normal" text-anchor="start">observed</text>
<circle cx="1233" cy="658" r="10" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<circle cx="1233" cy="658" r="6.5" fill="none" stroke="#2b2d42" stroke-width="1.5"/>
<text x="1255" y="663" font-size="14" fill="#333" font-weight="normal" text-anchor="start">deterministic</text>
<circle cx="1233" cy="688" r="5" fill="#4b5563"/>
<text x="1255" y="693" font-size="14" fill="#333" font-weight="normal" text-anchor="start">fixed input</text>
<rect x="1220" y="709" width="26" height="18" rx="4" fill="none" stroke="#8a9099" stroke-width="2"/>
<text x="1255" y="723" font-size="14" fill="#333" font-weight="normal" text-anchor="start">plate: repeated over the index</text>
<text x="1220" y="765" font-size="13" fill="#5c6670" font-weight="normal" text-anchor="start">blue = cell mix, orange = program activity</text>
<rect x="1205" y="780" width="360" height="98" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="1220" y="803" font-size="13.5" fill="#ea580c" font-weight="bold" text-anchor="start">Reported per-cell change β̂ is not this β:</text>
<text x="1220" y="823" font-size="13" fill="#333" font-weight="normal" text-anchor="start">π's posterior feeds the calibrated unmixing</text>
<text x="1220" y="841" font-size="13" fill="#333" font-weight="normal" text-anchor="start">(modular, or 'cut', Bayesian inference).</text>
<text x="1220" y="865" font-size="12" fill="#5c6670" font-weight="normal" text-anchor="start">Bayesian fit: McFarland, Kang, Zhang; PALM-lite elsewhere.</text>
</svg>