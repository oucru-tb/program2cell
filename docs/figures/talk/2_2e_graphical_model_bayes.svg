<text x="1093" y="490" font-size="12" fill="#2b2d42" font-weight="normal" text-anchor="start">count</text>
<circle cx="1085" cy="620" r="31" fill="#cfd4da" stroke="#2b2d42" stroke-width="2.5"/>
<text x="1085" y="627" font-size="22" font-weight="bold" fill="#2b2d42" text-anchor="middle">Y<tspan font-size="13.2" dy="5">ig</tspan></text>
<text x="1093" y="666" font-size="12" fill="#2b2d42" font-weight="normal" text-anchor="start">bulk</text>
<text x="1093" y="680" font-size="12" fill="#2b2d42" font-weight="normal" text-anchor="start">counts</text>
<circle cx="1085" cy="790" r="6" fill="#4b5563"/>
<text x="1062" y="796" font-size="18" font-weight="bold" fill="#4b5563" text-anchor="end">θ<tspan font-size="11" dy="4">g</tspan></text>
<text x="1100" y="788" font-size="11.5" fill="#5c6670" font-weight="normal" text-anchor="start">dispersion</text>
<text x="1100" y="802" font-size="11.5" fill="#5c6670" font-weight="normal" text-anchor="start">(plug-in)</text>
