<text x="600" y="578" font-size="12.5" fill="#ea580c" font-weight="normal" text-anchor="middle">program activity</text>
<circle cx="890" cy="580" r="31" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
<text x="890" y="587" font-size="22" font-weight="bold" fill="#ea580c" text-anchor="middle">u<tspan font-size="13.2" dy="5">ip</tspan></text>
<text x="890" y="628" font-size="12.5" fill="#ea580c" font-weight="normal" text-anchor="middle">patient factor</text>
<text x="890" y="643" font-size="12.5" fill="#ea580c" font-weight="normal" text-anchor="middle">(all types)</text>
